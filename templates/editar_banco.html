<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Editar Banco</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container mt-5">

    <a href="/bancos" class="btn btn-dark mb-4">
        ⬅ Voltar
    </a>

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Editar Banco
        </h2>

        <form method="post">

            <input
            type="text"
            name="nome_banco"
            value="{{ banco.nome_banco }}"
            class="form-control mb-3"
            required
            >

            <input
            type="text"
            name="cidade"
            value="{{ banco.cidade }}"
            class="form-control mb-3"
            required
            >

            <input
            type="number"
            step="0.01"
            name="valor"
            value="{{ banco.valor }}"
            class="form-control mb-3"
            required
            >

            <input
            type="text"
            name="descricao"
            value="{{ banco.descricao }}"
            class="form-control mb-3"
            required
            >

            <button class="btn btn-primary">
                Salvar Alterações
            </button>

        </form>

    </div>

</div>

</body>
</html>
