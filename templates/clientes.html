<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">

<title>Clientes</title>

</head>

<body>

<div class="container mt-5">

<a href="/dashboard" class="btn btn-outline-dark mb-4">
    ← Voltar Dashboard
</a>

<h2>Clientes</h2>

<form method="post">

<input type="text" name="nome" class="form-control mb-3" placeholder="Nome Cliente">

<input type="text" name="cidade" class="form-control mb-3" placeholder="Cidade">

<button class="btn btn-dark">
Salvar Cliente
</button>

</form>

<hr>

<table class="table table-striped">

<thead>
<tr>
<th>ID</th>
<th>Nome</th>
<th>Cidade</th>
<th>Ações</th>
</tr>
</thead>

<tbody>

{% for c in clientes %}

<tr>
<td>{{ c.id }}</td>
<td>{{ c.nome }}</td>
<td>{{ c.cidade }}</td>
<td>

    <a
    href="/editar-cliente/{{ c.id }}"
    class="btn btn-sm btn-primary"
    >
        Editar
    </a>

    <a
    href="/excluir-cliente/{{ c.id }}"
    class="btn btn-sm btn-danger"
    onclick="return confirm('Excluir cliente?')"
    >
        Excluir
    </a>

</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
