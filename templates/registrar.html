<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">

<title>Registrar</title>

</head>

<body class="bg-dark">

<div class="container">

<div class="row vh-100 justify-content-center align-items-center">

<div class="col-md-4">

<div class="login-box">

<h2 class="text-center mb-4">
Criar Conta
</h2>

<form method="post" action="/registrar">

<input
type="text"
name="usuario"
class="form-control mb-3"
placeholder="Usuário"
required
>

<input
type="email"
name="email"
class="form-control mb-3"
placeholder="Email"
required
>

<input
type="password"
name="senha"
class="form-control mb-3"
placeholder="Senha"
required
>

<button class="btn btn-dark w-100">
Cadastrar
</button>

</form>

<div class="text-center mt-3">

<a href="/">
Voltar Login
</a>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
