<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">

<title>Bancos</title>

</head>

<body>

<div class="container mt-5">

<a href="/dashboard" class="btn btn-outline-dark mb-4">
    ← Voltar Dashboard
</a>

<h2>Bancos</h2>

<form method="post">

<input type="text" name="nome_banco" class="form-control mb-3" placeholder="Nome Banco">

<input type="text" name="cidade" class="form-control mb-3" placeholder="Cidade">

<input type="number" step="0.01" name="valor" class="form-control mb-3" placeholder="Valor">

<input type="text" name="descricao" class="form-control mb-3" placeholder="Descrição">

<button class="btn btn-dark">
Salvar Banco
</button>

</form>

<hr>

<table class="table table-striped">

<thead>
<tr>
<th>Ações</th>
<th>ID</th>
<th>Banco</th>
<th>Cidade</th>
<th>Valor</th>
<th>Descrição</th>
</tr>
</thead>

<tbody>

{% for b in bancos %}

<tr>
<td>{{ b.id }}</td>
<td>{{ b.nome_banco }}</td>
<td>{{ b.cidade }}</td>
<td>R$ {{ b.valor }}</td>
<td>{{ b.descricao }}</td>
<td>

    <a
    href="/editar-banco/{{ b.id }}"
    class="btn btn-sm btn-primary"
    >
        Editar
    </a>

    <a
    href="/excluir-banco/{{ b.id }}"
    class="btn btn-sm btn-danger"
    onclick="return confirm('Excluir banco?')"
    >
        Excluir
    </a>

</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
